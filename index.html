<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Food Finder — Lancaster</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: color-mix(in srgb, CanvasText 15%, transparent);
      --border-strong: color-mix(in srgb, CanvasText 30%, transparent);
      --muted: color-mix(in srgb, CanvasText 55%, Canvas);
      --accent: #1f6f4a;
      --accent-bg: color-mix(in srgb, var(--accent) 14%, Canvas);
      --probable: #a3690a;
      --probable-bg: color-mix(in srgb, var(--probable) 14%, Canvas);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      background: Canvas;
      color: CanvasText;
    }
    header { margin-bottom: 2rem; }
    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 0.35rem;
    }
    #updated { color: var(--muted); font-size: 0.85rem; }

    .calendar {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.25rem;
      margin-bottom: 2rem;
    }
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .calendar-head h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
    .calendar-nav { display: flex; gap: 0.25rem; }
    .calendar-nav button, #clear-filter {
      border: 1px solid var(--border);
      background: transparent;
      color: CanvasText;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .calendar-nav button:hover, #clear-filter:hover { border-color: var(--border-strong); }
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .weekdays { color: var(--muted); font-size: 0.7rem; margin-bottom: 0.35rem; }
    .day {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border-radius: 6px;
      color: CanvasText;
    }
    .day.empty { visibility: hidden; }
    .day.has-events { cursor: pointer; font-weight: 600; }
    .day.has-events:hover { background: var(--border); }
    .day.has-events::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }
    .day.probable-only::after { background: var(--probable); }
    .day.selected { background: var(--accent); color: white; }
    .day.selected::after { background: white; }
    .day.today { border: 1px solid var(--border-strong); }

    #filter-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    section { margin-bottom: 2rem; }
    section > h2 { font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem; }
    .section-note { color: var(--muted); font-size: 0.82rem; margin: -0.5rem 0 0.9rem; }

    .event {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.6rem;
    }
    .event h3 { font-size: 1rem; font-weight: 600; margin: 0 0 0.2rem; }
    .event h3 a { color: inherit; text-decoration: none; }
    .event h3 a:hover { text-decoration: underline; }
    .event .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.4rem; }
    .event .desc { font-size: 0.88rem; line-height: 1.4; }
    .event .why { color: var(--probable); font-size: 0.78rem; margin-top: 0.4rem; }
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }
    .tag.confirmed { background: var(--accent-bg); color: var(--accent); }
    .tag.probable { background: var(--probable-bg); color: var(--probable); }
    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Free Food Finder — Lancaster</h1>
    <p id="updated">Loading…</p>
  </header>

  <div class="calendar" id="calendar"></div>

  <div id="filter-bar">
    <span id="filter-label"></span>
    <button id="clear-filter">Show all</button>
  </div>

  <section>
    <h2>Confirmed free food</h2>
    <div id="confirmed-events"></div>
  </section>

  <section id="probable-section">
    <h2>Probably has food</h2>
    <p class="section-note">Talks, seminars and networking events with a guest speaker often serve food or drinks without saying so in the listing — these are a heuristic guess, not confirmed.</p>
    <div id="probable-events"></div>
  </section>

  <script>
    let confirmed = [];
    let probable = [];
    let calendarMonth = new Date();
    let selectedDate = null;

    function dayKey(date) {
      // Avoid toISOString() here: it converts to UTC, which can shift the
      // calendar date by a day depending on the viewer's timezone. Event
      // dates are compared as plain "YYYY-MM-DD" strings taken directly
      // from the source data, so the grid must use the same local-literal
      // format rather than a UTC-normalized one.
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function datesOf(list) {
      return new Set(list.filter(e => e.start_date_iso).map(e => e.start_date_iso.slice(0, 10)));
    }

    function renderCalendar() {
      const container = document.getElementById('calendar');
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const monthLabel = calendarMonth.toLocaleString(undefined, { month: 'long', year: 'numeric' });

      const confirmedDays = datesOf(confirmed);
      const probableDays = datesOf(probable);

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first grid
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayKey = dayKey(new Date());

      let cells = '';
      for (let i = 0; i < startOffset; i++) cells += '<div class="day empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const key = dayKey(new Date(year, month, d));
        const classes = ['day'];
        if (confirmedDays.has(key)) classes.push('has-events');
        else if (probableDays.has(key)) classes.push('has-events', 'probable-only');
        if (key === todayKey) classes.push('today');
        if (key === selectedDate) classes.push('selected');
        cells += `<div class="${classes.join(' ')}" data-date="${key}">${d}</div>`;
      }

      container.innerHTML = `
        <div class="calendar-head">
          <h2>${monthLabel}</h2>
          <div class="calendar-nav">
            <button id="prev-month" aria-label="Previous month">‹</button>
            <button id="next-month" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="weekdays">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div>${d}</div>`).join('')}</div>
        <div class="days">${cells}</div>
      `;

      document.getElementById('prev-month').onclick = () => {
        calendarMonth = new Date(year, month - 1, 1);
        renderCalendar();
      };
      document.getElementById('next-month').onclick = () => {
        calendarMonth = new Date(year, month + 1, 1);
        renderCalendar();
      };
      container.querySelectorAll('.day.has-events').forEach(el => {
        el.onclick = () => {
          selectedDate = el.dataset.date === selectedDate ? null : el.dataset.date;
          renderCalendar();
          renderEvents();
        };
      });
    }

    function eventCard(e, tagClass, tagLabel) {
      const reasons = e.probable_reasons && e.probable_reasons.length
        ? `<div class="why">Why: ${e.probable_reasons.join('; ')}</div>`
        : '';
      return `
        <div class="event">
          <span class="tag ${tagClass}">${tagLabel}</span>
          <h3><a href="${e.url}" target="_blank" rel="noopener">${e.title}</a></h3>
          <div class="meta">${e.group_name ? e.group_name + ' · ' : ''}${e.start_date || ''}${e.location ? ' · ' + e.location : ''}</div>
          <div class="desc">${e.description ? e.description.slice(0, 200) : ''}</div>
          ${reasons}
        </div>
      `;
    }

    function renderList(containerId, list, tagClass, tagLabel, emptyText) {
      const container = document.getElementById(containerId);
      const filtered = selectedDate
        ? list.filter(e => e.start_date_iso && e.start_date_iso.slice(0, 10) === selectedDate)
        : list;

      container.innerHTML = filtered.length
        ? filtered.map(e => eventCard(e, tagClass, tagLabel)).join('')
        : `<p class="empty-state">${emptyText}</p>`;
    }

    function renderEvents() {
      const filterBar = document.getElementById('filter-bar');

      if (selectedDate) {
        filterBar.style.display = 'flex';
        document.getElementById('filter-label').textContent =
          `Showing events on ${new Date(selectedDate + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}`;
      } else {
        filterBar.style.display = 'none';
      }

      renderList('confirmed-events', confirmed, 'confirmed', 'Free food', 'No confirmed free food events right now.');
      renderList('probable-events', probable, 'probable', 'Probably free food', 'No likely candidates right now.');
    }

    document.getElementById('clear-filter').onclick = () => {
      selectedDate = null;
      renderCalendar();
      renderEvents();
    };

    fetch('data/results.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('updated').textContent =
          `Last checked: ${new Date(data.generated_at).toLocaleString()} — ${data.free_food_count} confirmed, ${data.probable_free_food_count} probable`;

        confirmed = data.events.filter(e => e.free_food);
        probable = data.events.filter(e => e.probable_free_food);
        renderCalendar();
        renderEvents();
      })
      .catch(() => {
        document.getElementById('updated').textContent = 'Could not load results.json yet — run the scraper first.';
        renderCalendar();
      });
  </script>
</body>
</html>
